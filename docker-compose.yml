services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ey_demo
      POSTGRES_USER: ey_user
      POSTGRES_PASSWORD: ey_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2
    container_name: keycloak
    command:
      - start-dev
      - --import-realm
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
    - keycloak_data:/opt/keycloak/data
    - ./keycloak:/opt/keycloak/data/import
  postgres-mcp:
    image: openmcpserver/mcp-postgres
    restart: unless-stopped
    container_name: postgres-mcp
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://ey_user:ey_password@postgres:5432/ey_demo
      POSTGRES_READ_ONLY: "true"

  postgres-mcp-proxy:
    image: nginx:alpine
    container_name: postgres-mcp-proxy
    restart: unless-stopped
    depends_on:
      - postgres-mcp
    volumes:
      - ./nginx-mcp.conf:/etc/nginx/conf.d/default.conf

  redis:
    image: redis/redis-stack-server:latest
    container_name: support_assistant_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  app:
    build: .
    container_name: support_assistant_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      DATABASE_URL: postgresql://ey_user:ey_password@postgres:5432/ey_demo
      REDIS_URL: redis://redis:6379/0
      MCP_URL: http://postgres-mcp-proxy:80/sse
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_BASE_URL: http://localhost:8080
      APP_BASE_URL: http://localhost:8000
      KEY_CLOAK_REDIRECT_URI: http://localhost:8000/auth/callback
    depends_on:
      - postgres
      - redis
      - keycloak
      - postgres-mcp
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
volumes:
  postgres_data:
  redis_data:
  keycloak_data: