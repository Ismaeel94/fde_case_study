server {
    listen 80;
    location / {
        proxy_pass http://postgres-mcp:8080;
        proxy_set_header Host localhost:80;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
    }
}